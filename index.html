<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>


<body class="">

    <nav class="nav justify-content-center bg-white">
        <a class="nav-link text-black" href="https://wordly.org">
            <div>Wordly Clone</div>
        </a>
        <div class="col-4">
            <!-- <img class="card-img-top" src="holder.js/100px180/" alt="Wordly" /> -->
        </div>
        <a class="nav-link active" href="#" aria-current="page">Home</a>
        <a class="nav-link" href="#">Stats</a>
        <!-- <a class="nav-link disabled" href="#">Disabled link</a> -->
    </nav>

    <div class="form-check ">
        <input class="form-check-input" type="checkbox" value="debug" id="debug" />
        <label class="form-check-label text-white" for=""> Debug </label>
    </div>
    <div class="container text-white">
        <div class="d-flex ">
            <div class="m-3 ">
                <label for="" class="form-label">Word Size</label>
                <input type="text" class="form-control" name="" id="" aria-describedby="helpId" placeholder="" />
            </div>
            <div class="m-3 ">
                <label for="" class="form-label">Size</label>
                <input type="text" class="form-control" name="" id="" aria-describedby="helpId" placeholder="" />
            </div>
        </div>
        <div class="">
            <button type="button" name="" id="" class="btn btn-primary">
                Button
            </button>
        </div>

    </div>


    <div class="m-3 row row_0 d-flex justify-content-center debug visually-hidden">
        <div class="col_0 box"></div>
        <div class="col_1 box"></div>
        <div class="col_2 box"></div>
        <div class="col_3 box"></div>
        <div class="col_4 box"></div>
    </div>
    <div class="container text-start boardgame p-3">
        <!-- Board Game -->
    </div>
    <div class="container mb-3">
        <div class="row d-flex justify-content-center keyboard">

            <!-- <div class="row row_5 d-flex justify-content-center"> -->
            <div class="row d-flex justify-content-center">

                <div class="box">Q</div>
                <div class="box">W</div>
                <div class="box">E</div>
                <div class="box">R</div>
                <div class="box">T</div>
                <div class="box">Y</div>
                <div class="box">U</div>
                <div class="box">I</div>
                <div class="box">O</div>
                <div class="box">P</div>
            </div>
            <div class="row d-flex justify-content-center">
                <div class="box">A</div>
                <div class="box">S</div>
                <div class="box">D</div>
                <div class="box">F</div>
                <div class="box">G</div>
                <div class="box">H</div>
                <div class="box">J</div>
                <div class="box">K</div>
                <div class="box">L</div>
            </div>
            <div class="row d-flex justify-content-center">
                <div class="box"><i class="fas fa-arrow-left"></i></div>
                <div class="box">Z</div>
                <div class="box">X</div>
                <div class="box">C</div>
                <div class="box">V</div>
                <div class="box">B</div>
                <div class="box">N</div>
                <div class="box">M</div>
                <div class="box">Enter</div>
            </div>
        </div>
        <!-- keyboard -->
    </div>
    </div>


</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
<script src="script.js"></script>

</html>
